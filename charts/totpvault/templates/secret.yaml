{{- /*
Chart-managed Secret, rendered only when no existingSecret is provided.

Required values (DB_PASSWORD, ENCRYPTION_KEY, DB_ROOT_PASSWORD for the bundled
MariaDB) that are not supplied in .Values.secrets are randomly generated on
first install and reused on upgrades via lookup, so `helm upgrade` never
rotates them. The resource-policy annotation keeps the Secret on uninstall
because losing ENCRYPTION_KEY makes all stored TOTP secrets unreadable.

NOTE: `helm template` cannot use lookup — rendering offline generates fresh
random values every time. Use helm install/upgrade, or manage the Secret
yourself via secrets.existingSecret (recommended for production).
*/}}
{{- if not .Values.secrets.existingSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "totpvault.fullname" .)) }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = $existing.data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "totpvault.fullname" . }}
  labels:
    {{- include "totpvault.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | default (get $existingData "DB_PASSWORD") | default (randAlphaNum 24 | b64enc) }}
  {{- /* ENCRYPTION_KEY itself must be base64 of exactly 32 bytes; the secret
         data value is that string base64-encoded once more by Kubernetes. */}}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | default (get $existingData "ENCRYPTION_KEY") | default (randAlphaNum 32 | b64enc | b64enc) }}
  {{- if .Values.mariadb.enabled }}
  DB_ROOT_PASSWORD: {{ .Values.secrets.dbRootPassword | b64enc | default (get $existingData "DB_ROOT_PASSWORD") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- range $key, $value := dict
        "MAILERSEND_KEY" .Values.secrets.mailersendKey
        "GOOGLE_CLIENT_SECRET" .Values.secrets.googleClientSecret
        "MICROSOFT_CLIENT_SECRET" .Values.secrets.microsoftClientSecret
        "GITHUB_CLIENT_SECRET" .Values.secrets.githubClientSecret
        "KEYCLOAK_CLIENT_SECRET" .Values.secrets.keycloakClientSecret }}
  {{- $data := $value | b64enc | default (get $existingData $key) }}
  {{- if $data }}
  {{ $key }}: {{ $data }}
  {{- end }}
  {{- end }}
{{- end }}
